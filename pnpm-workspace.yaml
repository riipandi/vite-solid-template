# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

allowBuilds:
  lefthook: true

# Disable the minimumReleaseAge supply-chain policy. It is enforced by default
# in pnpm 10 but is off in pnpm 11 (local). `minimumReleaseAgeExclude` below is
# a pnpm 11-only feature ignored by pnpm 10. Set this to a positive value only
# after aligning the Docker pnpm version with pnpm 11.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@solidjs/vite-plugin'

nodeLinker: hoisted
